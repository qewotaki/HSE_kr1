<section id="section1">
<h2>Форма 1. Контактные данные</h2>
<form action="https://www.google.com" method="post" target="_blank">
<label>Фамилия: <input type="text" name="last_name" value="Иванов" required></label><br>
<label>Имя: <input type="text" name="first_name" value="Иван" required></label><br>
<label>Отчество: <input type="text" name="middle_name" value="Иванович" required></label><br>
<label>Группа: <input type="text" name="student_group" value="БП25Д" required></label><br>
<label>Мобильный телефон: <input type="tel" name="mobile_phone" value="+79000000000" required></label><br>
<label>Электронная почта: <input type="email" name="email" value="example@mail.ru" required></label><br>
<label>Дата отправки сообщения: <input type="date" name="message_date" value="2026-10-14" required></label><br>
<input type="hidden" name="form_type" value="contact_data">
<button type="submit">Отправить контактные данные</button>
</form>
</section>
<section id="section2">
<h2>Форма 2. Заявка на билеты в кино</h2>
<form action="https://httpbin.org/post" method="post" target="_blank">
<label>Название фильма: <input type="text" name="film_title" value="Матрица" required></label><br>
<label>Количество билетов: <input type="number" name="tickets_count" min="1" max="10" value="2" required></label><br>
<p>Формат сеанса:</p>
<label><input type="radio" name="screening_format" value="2D" checked> 2D</label>
<label><input type="radio" name="screening_format" value="3D"> 3D</label><br>
<p>Дополнительно:</p>
<label><input type="checkbox" name="want_popcorn" value="yes" checked> Попкорн</label>
<label><input type="checkbox" name="want_drink" value="yes"> Напиток</label><br>
<label>Дата сеанса: <input type="date" name="session_date" value="2026-10-20" required></label><br>
<label>Тип места:
<select name="seat_type">
<option value="standard" selected>Стандарт</option>
<option value="comfort">Комфорт</option>
<option value="vip">VIP</option>
</select>
</label><br>
<label>Комментарий к заказу:<br>
<textarea name="order_comment" rows="3" cols="40" placeholder="Например, пожелания по местам"></textarea>
</label><br>
<label>Пароль: <input type="password" name="demo_password" value="demo123" required></label><br>
<input type="hidden" name="form_type" value="cinema_ticket_order">
<button type="submit">Отправить заявку</button>
</form>
</section>
</body>
